name: Keep Streamlit App Awake

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  ping-app:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Streamlit URL
        run: |
          URL="https://rajeevchugh71-badminton-buddies-badminton-app-kdxxkc.streamlit.app/"
          STATUS=$(curl -sS --max-time 30 -o /dev/null -w "%{http_code}" "$URL" || true)
          echo "Pinged $URL - Response code: $STATUS"

          case "$STATUS" in
            200|204|301|302|303|307|308)
              echo "App responded successfully"
              ;;
            *)
              echo "App did not return a healthy HTTP status"
              exit 1
              ;;
          esac
          